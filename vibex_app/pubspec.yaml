name: vibex_app
description: "VIBEX — AI-Assisted Music Learning Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Navigation
  go_router: ^14.8.1

  # State management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # HTTP client
  dio: ^5.8.0+1

  # Local storage
  shared_preferences: ^2.5.3

  # Audio
  audioplayers: ^6.4.0
  just_audio: ^0.10.2

  # Camera & vision
  camera: ^0.11.0+2
  permission_handler: ^11.4.0

  # Animations
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # Misc
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.7
  url_launcher: ^6.3.1
  logger: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  riverpod_generator: ^2.6.4
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
